<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت ورزشکاران و برنامه‌ها | Arash Fitness</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e5e7eb;font:15px Tahoma,Arial,sans-serif}main{max-width:1100px;margin:25px auto;padding:15px}h1{color:#6ee7b7}h2{font-size:19px}section{background:#172337;border:1px solid #334155;border-radius:15px;padding:20px;margin:16px 0}input,textarea,select,button{font:inherit;border-radius:8px;padding:10px}input,textarea,select{background:#0b1220;color:#fff;border:1px solid #64748b;width:100%;margin-top:6px}label{display:block;margin:12px 0}button{background:#34d399;border:0;color:#052e25;font-weight:bold;cursor:pointer;margin:6px 3px}button.secondary{background:#334155;color:white}button:disabled{opacity:.5}nav{display:flex;gap:12px;flex-wrap:wrap}a{color:#6ee7b7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.item{border:1px solid #475569;padding:12px;border-radius:10px;margin:8px 0}#message{min-height:24px;color:#fcd34d}[hidden]{display:none!important}small{color:#cbd5e1}fieldset{border:1px solid #475569;border-radius:10px;margin:10px 0}legend{padding:0 7px}</style><link rel="stylesheet" href="/assets/fitness-portals.css"> <script src="/demo-api.js"></script>
</head><body><main><nav><a href="/admin">پنل مدیریت</a><a href="/coach/schedule">جلسات مشاوره و پیام‌ها</a><a href="/athlete">پنل ورزشکار</a></nav><h1>مدیریت ورزشکاران و برنامه‌های تمرینی</h1><p id="message" role="status" aria-live="polite"></p><section id="authError" hidden><h2>ورود مدیریت لازم است</h2><p>ابتدا از پنل مدیریت وارد شوید و سپس این صفحه را باز کنید.</p><a href="/admin">رفتن به پنل مدیریت</a></section><div id="content" hidden><section><h2>ثبت ورزشکار جدید</h2><form id="athleteForm"><div class="grid"><label>نام کامل<input name="name" maxlength="150" required></label><label>ایمیل<input name="email" type="email" required></label><label>شماره تماس<input name="phone" maxlength="20" required></label><label>رمز اولیه (حداقل ۱۲ نویسه)<input name="password" type="password" minlength="12" autocomplete="new-password" required></label></div><button>ثبت ورزشکار</button></form><h2>ورزشکاران</h2><div id="athletes"></div></section><section><h2>ساخت / ویرایش برنامه تمرینی</h2><form id="planForm"><input type="hidden" name="plan_id"><div class="grid"><label>ورزشکار<select name="athlete_id" id="athleteSelect" required></select></label><label>عنوان برنامه<input name="title" maxlength="180" required></label><label>وضعیت<select name="status"><option value="draft">پیش‌نویس</option><option value="published">منتشرشده</option><option value="archived">آرشیو</option></select></label><label>شروع<input name="starts_on" type="date"></label><label>پایان<input name="ends_on" type="date"></label></div><label>توضیحات<textarea name="description" maxlength="10000" rows="3"></textarea></label><div id="sessions"></div><button type="button" class="secondary" id="addDay">افزودن روز تمرین</button><button type="submit">ذخیره برنامه</button><button type="button" class="secondary" id="resetPlan">برنامه جدید</button></form></section><section><h2>برنامه‌های ثبت‌شده</h2><div id="plans"></div></section><section><h2>گزارش پیشرفت ورزشکار</h2><label>ورزشکار<select id="progressAthlete"></select></label><button id="showProgress">نمایش گزارش‌ها</button><div id="progress"></div></section></div></main><script>
'use strict';let csrf='',athletes=[],plans=[];const $=id=>document.getElementById(id);const msg=(t,kind='info')=>{$('message').textContent=t;$('message').dataset.kind=kind};const node=(tag,text)=>{const n=document.createElement(tag);n.textContent=String(text??'');return n};const option=(v,t)=>{const n=node('option',t);n.value=v;return n};
async function api(path,method='GET',body){const r=await fetch('/api/v1/'+path,{method,credentials:'same-origin',headers:{'Accept':'application/json','Content-Type':'application/json',...(csrf?{'X-CSRF-Token':csrf}:{})},...(body!==undefined?{body:JSON.stringify(body)}:{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'خطای سرور ('+r.status+')');return d}
function addExercise(container,ex={}){const row=node('div');row.className='item exercise';const fields=[['name','نام حرکت','text'],['sets','ست','number'],['reps','تکرار','text']];for(const [key,label,type] of fields){const l=node('label',label);const input=document.createElement('input');input.dataset.field=key;input.type=type;input.value=ex[key]??'';if(key==='name')input.required=true;if(key==='sets'){input.min='1';input.max='30'}l.append(input);row.append(l)}const remove=node('button','حذف حرکت');remove.type='button';remove.className='secondary';remove.onclick=()=>row.remove();row.append(remove);container.append(row)}
function addDay(day={}){const wrap=node('fieldset');wrap.className='day';const legend=node('legend','روز تمرین');wrap.append(legend);const label=node('label','نام روز');const inp=document.createElement('input');inp.className='dayName';inp.required=true;inp.maxLength=80;inp.value=day.day||'';label.append(inp);wrap.append(label);const exercises=node('div');exercises.className='exercises';wrap.append(exercises);for(const ex of day.exercises||[{}])addExercise(exercises,ex);const add=node('button','افزودن حرکت');add.type='button';add.className='secondary';add.onclick=()=>addExercise(exercises);const remove=node('button','حذف روز');remove.type='button';remove.className='secondary';remove.onclick=()=>wrap.remove();wrap.append(add,remove);$('sessions').append(wrap)}
function readSessions(){return [...document.querySelectorAll('.day')].map(day=>({day:day.querySelector('.dayName').value.trim(),exercises:[...day.querySelectorAll('.exercise')].map(row=>{const f=k=>row.querySelector('[data-field="'+k+'"]').value.trim();return {name:f('name'),sets:f('sets')?Number(f('sets')):null,reps:f('reps')||null}})}))}
function resetPlan(){$('planForm').reset();$('planForm').elements.plan_id.value='';$('sessions').replaceChildren();addDay()}
function renderAthletes(){$('athletes').replaceChildren();for(const a of athletes){const item=node('div',a.name+' — '+a.email+' — '+a.phone);item.className='item';$('athletes').append(item)}for(const id of ['athleteSelect','progressAthlete']){$(id).replaceChildren(...athletes.map(a=>option(a.id,a.name+' ('+a.email+')')))}}
function renderPlans(){$('plans').replaceChildren();for(const p of plans){const item=node('div',p.title+' — '+(athletes.find(a=>a.id===p.athlete_id)?.name||'ورزشکار #'+p.athlete_id)+' — '+p.status);item.className='item';const edit=node('button','ویرایش');edit.type='button';edit.onclick=()=>{resetPlan();for(const key of ['athlete_id','title','description','status','starts_on','ends_on'])$('planForm').elements[key].value=p[key]||'';$('planForm').elements.plan_id.value=p.id;$('sessions').replaceChildren();for(const s of p.sessions||[])addDay(s);$('planForm').scrollIntoView({behavior:'smooth'})};item.append(edit);$('plans').append(item)}if(!plans.length)$('plans').append(node('p','هنوز برنامه‌ای ثبت نشده است.'))}
async function refresh(){const [a,p]=await Promise.all([api('admin/athletes'),api('admin/training-plans')]);athletes=a.athletes||[];plans=p.plans?.data||[];renderAthletes();renderPlans()}
$('addDay').onclick=()=>addDay();$('resetPlan').onclick=resetPlan;
$('athleteForm').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));await api('admin/athletes','POST',d);e.target.reset();await refresh();msg('ورزشکار ثبت شد')}catch(err){msg(err.message,'error')}};
$('planForm').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));const id=d.plan_id;delete d.plan_id;d.athlete_id=Number(d.athlete_id);d.starts_on=d.starts_on||null;d.ends_on=d.ends_on||null;d.sessions=readSessions();if(!d.sessions.length||d.sessions.some(s=>!s.exercises.length))throw Error('حداقل یک روز و یک حرکت لازم است');await api(id?'admin/training-plans/'+id:'admin/training-plans',id?'PUT':'POST',d);resetPlan();await refresh();msg('برنامه ذخیره شد')}catch(err){msg(err.message,'error')}};
$('showProgress').onclick=async()=>{try{const id=$('progressAthlete').value;if(!id)return;const d=await api('admin/athletes/'+encodeURIComponent(id)+'/progress');$('progress').replaceChildren(...(d.progress||[]).map(p=>{const n=node('div',p.performed_on+' | '+p.session_day+' | سختی '+(p.effort??'-')+' | '+(p.notes||''));n.className='item';return n}));if(!d.progress.length)$('progress').append(node('p','گزارشی ثبت نشده است'))}catch(err){msg(err.message,'error')}};
(async()=>{try{const session=await api('auth/session');if(!session.authenticated){$('authError').hidden=false;return}csrf=session.csrfToken;await refresh();resetPlan();$('content').hidden=false}catch(err){msg(err.message,'error');$('authError').hidden=false}})();
</script></body></html>
