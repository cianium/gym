name: FTA Pages release candidate QA
on:
  push:
    branches: [migration/fta-v3-integration]
    paths: ['fta-v3/tests/pages-rc5.spec.mjs', '.github/workflows/fta-pages-release-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 4ecefe7a2222c900a11133af21b4171df3ee386b
          path: preview/gym
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        working-directory: fta-v3/tests
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
      - name: Static release verification
        working-directory: fta-v3/tests
        run: |
          find ../../preview/gym -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m http.server 4173 --bind 127.0.0.1 --directory ../../preview >/tmp/pages.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/gym/ >/dev/null && break; sleep 1; done
          npx playwright test pages-rc5.spec.mjs --reporter=line --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fta-rc5-pages-screenshots
          path: fta-v3/tests/test-results/
          if-no-files-found: ignore
