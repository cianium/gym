name: ARASH Fitness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: arash-fitness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_arash_fitness
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, fileinfo, filter, gd, hash, json, mbstring, openssl, pdo, pdo_mysql, session, tokenizer, xml, dom, pcntl
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p laravel_core/bootstrap/cache
          mkdir -p laravel_core/storage/framework/cache/data
          mkdir -p laravel_core/storage/framework/sessions
          mkdir -p laravel_core/storage/framework/views
          mkdir -p laravel_core/storage/logs
          chmod -R u+rwX laravel_core/bootstrap/cache laravel_core/storage

      - name: Install Composer dependencies
        run: composer install --working-dir=laravel_core --no-interaction --prefer-dist --no-progress

      - name: PHP syntax checks
        working-directory: laravel_core
        run: |
          find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Database-free regression checks
        working-directory: laravel_core
        run: php tests/static_runtime_regressions.php

      - name: Route security smoke checks
        working-directory: laravel_core
        run: php tests/route_security_smoke.php

      - name: Client checkout regression checks
        working-directory: laravel_core
        run: node tests/client_checkout_gate.mjs

      - name: Laravel MySQL feature and concurrency tests
        working-directory: laravel_core
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: test_arash_fitness
          DB_USERNAME: root
          DB_PASSWORD: root
          ARASH_ALLOW_DESTRUCTIVE_TESTS: YES_DISPOSABLE_DATABASE
        run: php vendor/bin/phpunit --configuration phpunit.mysql.xml
