name: FTA Pages browser QA
on:
  push:
    branches: [migration/fta-v3-foundation]
    paths: ['fta-v3/tests/pages/**', '.github/workflows/fta-pages-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: demo/fta-pages
          path: pages-preview
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser testing dependencies
        working-directory: fta-v3/tests/pages
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
      - name: Run browser QA against published tree
        working-directory: fta-v3/tests/pages
        run: |
          node --check ../../../pages-preview/app.js
          python3 -m http.server 4173 --bind 127.0.0.1 --directory ../../../pages-preview > /tmp/fta-pages-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx playwright test preview.spec.js --reporter=line
