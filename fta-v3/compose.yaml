services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: fta_demo
      POSTGRES_USER: fta_demo
      POSTGRES_PASSWORD: ${FTA_DEMO_DB_PASSWORD:?Set random hexadecimal demo password}
    volumes:
      - demo_db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fta_demo -d fta_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./api
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        WORKDIR /app
        RUN apt-get update && apt-get install -y --no-install-recommends openssl ca-certificates && rm -rf /var/lib/apt/lists/*
        COPY package.json tsconfig.json ./
        COPY prisma ./prisma
        RUN npm install --no-audit --no-fund && npm run db:generate
        COPY src ./src
        RUN npm run build && npm prune --omit=dev
        USER node
        CMD ["sh", "-c", "npm run db:migrate && exec node dist/main.js"]
    environment:
      FTA_MODE: demo
      DATABASE_URL: postgresql://fta_demo:${FTA_DEMO_DB_PASSWORD:?Set demo database password}@db:5432/fta_demo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ./web
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        WORKDIR /app
        ENV NEXT_TELEMETRY_DISABLED=1
        COPY package.json ./
        RUN npm install --no-audit --no-fund
        COPY app ./app
        RUN npm run build && chown -R node:node /app
        USER node
        CMD ["npm", "start"]
    environment:
      FTA_API_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3080:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  demo_db:
