<script>
"use strict";
const seed={members:248,active:213,revenue:186500000,appointments:18,week:[42,68,54,82,61,92,74],athlete:"کیان رضایی",goal:78,workouts:4};
function readState(){try{return Object.assign({},seed,JSON.parse(localStorage.getItem("arash-demo-state")||"{}"))}catch(e){return Object.assign({},seed)}}
let state=readState(),role="",page="dashboard";
const $=id=>document.getElementById(id);\nfunction esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll("\\"","&quot;").replaceAll("\\'","&#39;")}
function save(){try{localStorage.setItem("arash-demo-state",JSON.stringify(state))}catch(e){notify("ذخیره مرورگر در دسترس نیست")}}
function notify(s){const t=$("toast");t.textContent=s;t.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove("show"),2200)}
function entry(){role="";$("app").innerHTML='<div class="shell login"><div class="top"><div class="brand"><div class="mark">A</div><div><strong>ARASH FITNESS</strong><small>باشگاه و پلتفرم مدیریت هوشمند</small></div></div><span class="demo-tag">INTERACTIVE DEMO</span></div><section class="card"><h1>به تجربه ARASH Fitness خوش آمدید</h1><p>یک محیط را انتخاب کنید. اطلاعات نمونه است و هیچ عملیات واقعی مالی یا ثبت‌نامی انجام نمی‌شود.</p><div class="role-grid"><button class="role" data-role="admin"><b>▦ پنل مدیریت باشگاه</b><span>داشبورد، ورزشکاران، مربیان، اشتراک‌ها و گزارش‌ها</span></button><button class="role" data-role="athlete"><b>◉ پنل ورزشکار</b><span>پروفایل، برنامه تمرینی، پیشرفت، رزرو و کارت عضویت</span></button></div></section></div>'}
const adminNav=[["dashboard","داشبورد"],["members","ورزشکاران"],["coaches","مربیان"],["plans","اشتراک‌ها"],["training","برنامه تمرینی"],["appointments","رزروها"],["finance","مالی و گزارش‌ها"],["settings","تنظیمات"]];
const userNav=[["dashboard","داشبورد من"],["profile","پروفایل من"],["program","برنامه تمرینی"],["progress","پیشرفت من"],["appointments","رزرو مشاوره"],["messages","پیام‌های مربی"],["membership","کارت عضویت"]];
function heading(a,b){return '<div class="welcome"><div><h1>'+esc(a)+'</h1><p>'+esc(b)+'</p></div><span class="date">نسخه نمایشی · ۱۴۰۵</span></div>'}
function stat(a,b,c){return '<section class="card stat"><div class="label">'+a+'</div><div class="value">'+b+'</div><small>'+c+'</small></section>'}
function row(a,b,c,k){return '<div class="row"><div><strong>'+esc(a)+'</strong><small>'+esc(b)+'</small></div><span class="badge '+(k==="gold"?"gold":"")+'">'+esc(c||"فعال")+'</span></div>'}
function layout(content){const items=role==="admin"?adminNav:userNav;$("app").innerHTML='<div class="shell"><header class="top"><div class="brand"><div class="mark">A</div><div><strong>ARASH FITNESS</strong><small>'+(role==="admin"?"مدیریت باشگاه":"پنل ورزشکار")+'</small></div></div><div class="top-actions"><span class="demo-tag">DEMO MODE · داده نمونه</span><button class="pill" id="exit">خروج از دمو</button></div></header><div class="layout"><aside class="side"><div class="side-title">منوی اصلی</div><nav class="nav">'+items.map(x=>'<button data-page="'+x[0]+'" class="'+(page===x[0]?"active":"")+'">'+x[1]+'</button>').join("")+'</nav><div class="side-foot">نسخه نمایشی مستقل<br>ذخیره تغییرات فقط در مرورگر</div></aside><main class="main">'+content+'</main></div></div>'}
function bars(){return '<div class="bars">'+state.week.map((n,i)=>'<div class="bar" style="height:'+n+'%"><span>'+["ش","ی","د","س","چ","پ","ج"][i]+'</span></div>').join("")+'</div>'}
function adminHome(){return heading("داشبورد مدیریت","نمای کلی عملکرد باشگاه")+ '<section class="hero"><div><span class="demo-tag">شعبه مرکزی</span><h2>مدیریت هوشمند، تجربه حرفه‌ای</h2><p>وضعیت اعضا، برنامه مربیان، رزروها و گزارش درآمد را یک‌جا ببینید.</p><button class="btn primary" data-go="members">مدیریت ورزشکاران</button></div><div class="hero-art">✦</div></section><div class="grid">'+stat("کل ورزشکاران",state.members.toLocaleString("fa-IR"),"↑ ۱۲٪ نسبت به ماه قبل")+stat("اشتراک فعال",state.active.toLocaleString("fa-IR"),"۸۶٪ نرخ تمدید")+stat("درآمد این ماه",new Intl.NumberFormat("fa-IR").format(state.revenue)+" تومان","↑ ۸٫۴٪ رشد ماهانه")+stat("رزروهای امروز",state.appointments.toLocaleString("fa-IR"),"۶ رزرو در انتظار")+'</div><div class="cols"><section class="card"><h3>روند فعالیت هفتگی</h3>'+bars()+'</section><section class="card"><h3>وضعیت اشتراک‌ها</h3>'+row("اشتراک فعال","در حال استفاده",state.active)+row("نزدیک به انقضا","نیازمند پیگیری","۲۴","gold")+row("منقضی‌شده","نیازمند تمدید","۱۱")+'</section></div><section class="card"><h3>فعالیت‌های اخیر</h3>'+row("ثبت‌نام ورزشکار جدید","امیرحسین محمدی · امروز","جدید","gold")+row("تمدید اشتراک","پارسا احمدی · امروز","موفق")+row("رزرو جلسه مربی","سارا کریمی · امروز","در انتظار","gold")+'</section>'}
function memberPage(){const people=state.people||[{name:"کیان رضایی",phone:"۰۹۱۲۱۲۳۴۵۶۷",plan:"سه‌ماهه"},{name:"سارا کریمی",phone:"۰۹۳۵۱۲۳۴۵۶۷",plan:"شش‌ماهه"}];return heading("مدیریت ورزشکاران","پرونده اعضا و وضعیت اشتراک‌ها")+'<section class="card"><div class="card-head"><h3>فهرست ورزشکاران</h3><button class="btn primary" id="showAdd">+ افزودن ورزشکار</button></div><form id="addForm" class="hidden"><div class="form"><div class="field"><label>نام ورزشکار</label><input id="mName" required maxlength="60"></div><div class="field"><label>شماره تماس نمونه</label><input id="mPhone" maxlength="20"></div><div class="field"><label>اشتراک</label><select id="mPlan"><option>یک‌ماهه</option><option>سه‌ماهه</option><option>شش‌ماهه</option></select></div></div><button class="btn primary">ثبت عضو نمونه</button></form><div class="table-wrap"><table class="table"><thead><tr><th>نام</th><th>شماره تماس</th><th>اشتراک</th><th>عملیات</th></tr></thead><tbody>'+people.map((p,i)=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.phone)+'</td><td>'+esc(p.plan)+'</td><td><button class="btn" data-delete="'+i+'">حذف</button></td></tr>').join("")+'</tbody></table></div></section>'}
const generic={coaches:["مربیان","مدیریت مربیان",["آرش کاظمی · بدنسازی","مریم رضایی · فیتنس","علی صادقی · کراس‌فیت"]],plans:["اشتراک‌ها","طرح‌های عضویت",["یک‌ماهه · ۱,۲۰۰,۰۰۰ تومان","سه‌ماهه · ۳,۲۰۰,۰۰۰ تومان","شش‌ماهه · ۵,۸۰۰,۰۰۰ تومان"]],training:["برنامه‌های تمرینی","کتابخانه برنامه‌ها",["قدرت و هایپرتروفی · ۱۲ هفته","آمادگی عمومی · ۸ هفته","فیتنس · ۱۰ هفته"]],appointments:["رزروها و مشاوره‌ها","جلسات و درخواست‌ها",["۱۰:۰۰ · کیان رضایی · ارزیابی","۱۲:۳۰ · سارا کریمی · تغذیه","۱۷:۰۰ · امیرحسین · برنامه"]],finance:["مالی و گزارش‌ها","گزارش‌های درآمدی نمونه",["فروش اشتراک · ۸۴,۰۰۰,۰۰۰ تومان","فروش محصولات · ۳۲,۵۰۰,۰۰۰ تومان","جلسات خصوصی · ۷۰,۰۰۰,۰۰۰ تومان"]],settings:["تنظیمات باشگاه","اطلاعات پایه",["نام: آرش فیتنس","ساعات: ۶ تا ۲۳","شعبه: مرکزی"]]};
function genericPage(){const d=generic[page];return heading(d[0],d[1])+'<section class="card"><div class="card-head"><h3>'+d[0]+'</h3><button class="btn" id="addGeneric">+ افزودن مورد</button></div>'+d[2].map(x=>row(x,"اطلاعات نمونه")).join("")+'<div class="form"><div class="field"><label>عنوان مورد جدید</label><input id="genericTitle" maxlength="80"></div><div class="field"><label>وضعیت</label><select id="genericStatus"><option>فعال</option><option>پیش‌نویس</option></select></div></div><button class="btn primary" id="saveGeneric">ذخیره نمایشی</button><div id="genericItems"></div></section>'}
function athleteHome(){return heading("سلام، "+esc(state.athlete)+" عزیز","به فضای شخصی تمرین خوش آمدید")+'<section class="hero"><div><span class="demo-tag">هدف این ماه</span><h2>هر روز، یک قدم قوی‌تر</h2><p>این هفته '+state.workouts+' جلسه تمرین ثبت شده است.</p><button class="btn primary" data-go="program">مشاهده برنامه تمرینی</button></div><div class="hero-art">🏋️</div></section><div class="grid">'+stat("جلسات این هفته",state.workouts+" از ۶","هدف هفتگی")+stat("پیشرفت هدف",state.goal+"٪","روند ماهانه")+stat("روزهای عضویت","۱۲۸","عضویت فعال")+stat("جلسه بعدی","فردا","۱۸:۳۰ · مربی آرش")+'</div><div class="cols"><section class="card"><h3>پیشرفت هدف تمرینی</h3><div class="value">'+state.goal+'٪</div><div class="progress"><i style="width:'+state.goal+'%"></i></div><button class="btn" data-go="progress">جزئیات پیشرفت</button></section><section class="card"><div class="member"><small>ARASH FITNESS · ATHLETE PASS</small><h3>'+esc(state.athlete)+'</h3><p>عضو ویژه · AF-2048</p><div class="member-foot"><span>اعتبار تا ۱۴۰۵/۱۲/۲۹</span><b>ACTIVE</b></div></div></section></div>'}
function athletePage(){const names={profile:["پروفایل من","اطلاعات شخصی"],program:["برنامه تمرینی","جلسات هفتگی"],progress:["گزارش پیشرفت","روند هدف‌گذاری"],appointments:["رزرو مشاوره","درخواست جلسه با مربی"],messages:["ارتباط با مربی","گفتگو و بازخورد"],membership:["کارت عضویت","وضعیت اشتراک"]};const d=names[page];let body="";if(page==="profile")body='<form id="profileForm"><div class="field"><label>نام و نام خانوادگی</label><input id="athName" value="'+esc(state.athlete)+'" maxlength="60" required></div><button class="btn primary">ذخیره تغییرات</button></form>';if(page==="program")body=row("شنبه · بالاتنه","پرس سینه، قایقی، سرشانه","۶ حرکت")+row("دوشنبه · پایین‌تنه","اسکوات، لانج، پشت پا","۵ حرکت")+row("چهارشنبه · ترکیبی","ددلیفت، بارفیکس","۵ حرکت");if(page==="progress")body='<div class="value">'+state.goal+'٪</div><div class="progress"><i style="width:'+state.goal+'%"></i></div><button class="btn primary" id="progressAdd">ثبت پیشرفت +۳٪</button>';if(page==="appointments")body='<form id="bookingForm"><div class="field"><label>نوع جلسه</label><select id="session"><option>ارزیابی اولیه</option><option>مشاوره تمرینی</option><option>مشاوره تغذیه</option></select></div><button class="btn primary">ثبت درخواست رزرو</button></form><div id="bookings"></div>';if(page==="messages")body='<div class="row"><strong>مربی آرش</strong><span class="badge">پیام مربی</span></div><form id="messageForm"><div class="field"><label>پیام شما</label><textarea id="message" maxlength="500" required></textarea></div><button class="btn primary">ارسال پیام</button></form><div id="sent"></div>';if(page==="membership")body='<div class="member"><small>ARASH FITNESS · ATHLETE PASS</small><h3>'+state.athlete+'</h3><p>کد عضویت AF-2048</p><div class="member-foot"><span>اعتبار تا ۱۴۰۵/۱۲/۲۹</span><b>ACTIVE</b></div></div>';return heading(d[0],d[1])+'<section class="card"><h3>'+d[0]+'</h3>'+body+'</section>'}
function render(){if(!role){entry();return}let html=role==="admin"?(page==="dashboard"?adminHome():page==="members"?memberPage():genericPage()):(page==="dashboard"?athleteHome():athletePage());layout(html)}
function go(p){page=p;render()}
document.addEventListener("click",e=>{let t=e.target.closest("[data-role]");if(t){role=t.dataset.role;page="dashboard";render();return}t=e.target.closest("[data-page]");if(t){go(t.dataset.page);return}t=e.target.closest("[data-go]");if(t){go(t.dataset.go);return}if(e.target.closest("#exit")){entry();return}if(e.target.closest("#showAdd")){$("addForm").classList.toggle("hidden");return}if(e.target.closest("#addGeneric")){$("genericTitle").focus();return}if(e.target.closest("#saveGeneric")){let v=$("genericTitle").value.trim();if(!v){notify("عنوان را وارد کنید");return}$("genericItems").insertAdjacentHTML("beforeend",row(v,"مورد نمایشی","ذخیره شد"));$("genericTitle").value="";notify("مورد اضافه شد");return}if(e.target.closest("#progressAdd")){state.goal=Math.min(100,state.goal+3);save();render();notify("پیشرفت نمونه ثبت شد");return}t=e.target.closest("[data-delete]");if(t){let p=state.people||[{name:"کیان رضایی",phone:"۰۹۱۲۱۲۳۴۵۶۷",plan:"سه‌ماهه"},{name:"سارا کریمی",phone:"۰۹۳۵۱۲۳۴۵۶۷",plan:"شش‌ماهه"}];p.splice(Number(t.dataset.delete),1);state.people=p;state.members=Math.max(0,state.members-1);save();render();notify("عضو حذف شد")}});
document.addEventListener("submit",e=>{if(e.target.id==="addForm"){e.preventDefault();let p=state.people||[{name:"کیان رضایی",phone:"۰۹۱۲۱۲۳۴۵۶۷",plan:"سه‌ماهه"},{name:"سارا کریمی",phone:"۰۹۳۵۱۲۳۴۵۶۷",plan:"شش‌ماهه"}];p.unshift({name:$("mName").value.trim(),phone:$("mPhone").value.trim()||"ثبت نشده",plan:$("mPlan").value});state.people=p;state.members++;state.active++;save();render();notify("ورزشکار نمونه اضافه شد")}if(e.target.id==="profileForm"){e.preventDefault();state.athlete=$("athName").value.trim()||state.athlete;save();render();notify("پروفایل ذخیره شد")}if(e.target.id==="bookingForm"){e.preventDefault();$("bookings").insertAdjacentHTML("beforeend",row($("session").value,"درخواست آزمایشی","ثبت شد","gold"));notify("رزرو نمونه ثبت شد")}if(e.target.id==="messageForm"){e.preventDefault();let v=$("message").value.trim();if(v){$("sent").insertAdjacentHTML("beforeend",row("پیام شما",v.slice(0,100),"ارسال‌شده"));$("message").value="";notify("پیام نمونه ارسال شد")}}});
entry();
</script></body></html>
