<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10110f"><title>ARASH Fitness | Interactive Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f0e;--panel:#151917;--panel2:#1b211e;--line:#29332d;--gold:#d5b16f;--gold2:#f0d49b;--text:#f4f2eb;--muted:#8f9a91;--green:#79c69b;--red:#e58d83;--radius:20px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -15%,#293526 0,transparent 38%),var(--bg);color:var(--text);font-family:Vazirmatn,system-ui,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#f0d49b,#9a7135);display:grid;place-items:center;color:#14130f;font-weight:900;font-size:19px;box-shadow:0 8px 30px #d5b16f25}.brand strong{display:block;font-size:15px;letter-spacing:.3px}.brand small{color:var(--muted);font-size:11px}.top-actions{display:flex;gap:8px;align-items:center}.pill,.btn{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:10px 14px;font-size:12px}.btn.primary{background:var(--gold);border-color:var(--gold);color:#17140d;font-weight:800}.btn:hover,.nav button:hover{border-color:#8c744a}.demo-tag{font-size:10px;color:var(--gold2);background:#d5b16f15;border:1px solid #d5b16f44;padding:7px 10px;border-radius:30px}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}.side,.card,.hero{background:linear-gradient(145deg,#171d19,#121613);border:1px solid var(--line);border-radius:var(--radius)}.side{padding:16px;height:max-content;position:sticky;top:16px}.side-title{font-size:10px;color:var(--muted);padding:5px 10px 12px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:#b7c0b8;text-align:right;padding:11px 12px;border-radius:12px;font-size:12px;display:flex;align-items:center;gap:10px}.nav button.active{background:#d5b16f16;border-color:#d5b16f44;color:var(--gold2);font-weight:800}.nav .ico{width:22px;text-align:center;font-size:15px}.side-foot{border-top:1px solid var(--line);margin-top:14px;padding-top:14px;color:var(--muted);font-size:10px;line-height:2}.main{min-width:0}.welcome{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin:3px 0 18px}.welcome h1{font-size:23px;margin:0 0 5px}.welcome p{color:var(--muted);font-size:12px;margin:0}.date{font-size:11px;color:var(--gold2);background:#d5b16f12;border:1px solid #d5b16f30;border-radius:12px;padding:9px 12px;white-space:nowrap}.hero{padding:24px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;overflow:hidden;margin-bottom:16px;background:radial-gradient(circle at 8% 30%,#8e743326,transparent 32%),linear-gradient(110deg,#20291f,#171c18 62%)}.hero h2{font-size:20px;margin:0 0 7px}.hero p{font-size:12px;color:#aab3aa;margin:0 0 16px;max-width:540px;line-height:2}.hero-art{font-size:68px;opacity:.85;filter:drop-shadow(0 8px 22px #d5b16f22)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{padding:16px}.stat .label{color:var(--muted);font-size:11px}.stat .value{font-size:23px;font-weight:900;margin:7px 0 3px;letter-spacing:-.5px}.stat small{font-size:10px;color:var(--green)}.card{padding:18px;margin-bottom:14px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.card h3{font-size:14px;margin:0}.sub{font-size:10px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #ffffff0b}.row:first-of-type{border-top:0}.row strong{font-size:12px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.badge{font-size:10px;border-radius:20px;padding:5px 9px;background:#79c69b18;color:var(--green);white-space:nowrap}.badge.gold{background:#d5b16f18;color:var(--gold2)}.badge.red{background:#e58d8318;color:var(--red)}.progress{height:7px;background:#303a33;border-radius:10px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#9a783f,#f0d49b);border-radius:10px}.cols{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.bars{height:135px;display:flex;align-items:end;gap:10px;padding:12px 5px 0}.bar{flex:1;background:linear-gradient(0deg,#9c7940,#e4c783);border-radius:8px 8px 3px 3px;min-width:8px;position:relative;opacity:.9}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted)}.member{background:linear-gradient(120deg,#c9a15a,#f0d69e 55%,#9c7740);color:#211b10;border-radius:18px;padding:18px;position:relative;overflow:hidden}.member:after{content:'ARASH';position:absolute;left:14px;bottom:-15px;font-size:54px;font-weight:900;opacity:.09;letter-spacing:3px}.member .tiny{font-size:9px;letter-spacing:2px}.member h3{font-size:17px;margin:12px 0 4px}.member p{font-size:10px;margin:0;color:#44351c}.member-foot{display:flex;justify-content:space-between;margin-top:18px;font-size:9px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th{text-align:right;color:var(--muted);font-weight:500;padding:10px;border-bottom:1px solid var(--line)}.table td{padding:12px 10px;border-bottom:1px solid #ffffff0b}.avatar{width:34px;height:34px;border-radius:12px;background:#d5b16f20;color:var(--gold2);display:grid;place-items:center;font-weight:800}.person{display:flex;align-items:center;gap:9px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#0f1310;border:1px solid var(--line);border-radius:11px;padding:11px;color:var(--text);font-size:12px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--gold)}.empty{padding:26px;text-align:center;color:var(--muted);font-size:12px}.login{max-width:850px;margin:8vh auto;padding:28px}.login h1{font-size:27px;margin:0 0 8px}.login p{color:var(--muted);font-size:12px;line-height:2}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.role{padding:25px;text-align:right;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text)}.role:hover{border-color:var(--gold)}.role b{font-size:17px;display:block;margin:10px 0}.role span{font-size:11px;color:var(--muted);line-height:2}.role .big{font-size:32px}.toast{position:fixed;bottom:20px;left:20px;background:#202a22;border:1px solid #55755c;color:#d8f1df;border-radius:12px;padding:12px 16px;font-size:12px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}.mobilebar{display:none}.hidden{display:none!important}.notice{font-size:10px;color:var(--gold2);background:#d5b16f12;border:1px solid #d5b16f30;border-radius:12px;padding:10px 12px;line-height:2;margin-bottom:14px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.side{position:static}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-title,.side-foot{display:none}.cols{grid-template-columns:1fr}}
@media(max-width:560px){.shell{padding:13px}.top{margin-bottom:15px}.brand strong{font-size:13px}.brand small{font-size:9px}.top-actions .pill{display:none}.layout{gap:12px}.side{padding:8px;border-radius:15px}.nav button{padding:9px 10px;font-size:10px}.nav .ico{font-size:13px}.welcome h1{font-size:19px}.welcome p{font-size:10px}.date{font-size:9px;padding:7px}.hero{padding:18px}.hero h2{font-size:17px}.hero p{font-size:10px}.hero-art{font-size:42px}.grid{gap:8px}.stat{padding:12px}.stat .value{font-size:20px}.card{padding:14px}.cols{gap:8px}.table{min-width:540px}.table-wrap{overflow:auto}.role-grid{grid-template-columns:1fr}.login{margin:5vh 13px;padding:22px}.login h1{font-size:22px}.form{grid-template-columns:1fr}.top-actions .demo-tag{font-size:9px}}
</style>
</head>
<body>
<div id="app"></div><div class="toast" id="toast"></div>
<script>
const seed={name:"آرش کاظمی",members:248,active:213,revenue:186500000,coaches:8,appointments:18,orders:32,week:[42,68,54,82,61,92,74],athlete:"کیان رضایی",goal:78,workouts:4};
const state=JSON.parse(localStorage.getItem("arash-demo-state")||"null")||seed;
let role="",page="dashboard";
const money=n=>new Intl.NumberFormat("fa-IR").format(n)+" تومان";
const toast=m=>{let t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)};
const save=()=>localStorage.setItem("arash-demo-state",JSON.stringify(state));
function entry(){document.getElementById("app").innerHTML='<div class="shell login"><div class="top"><div class="brand"><div class="mark">A</div><div><strong>ARASH FITNESS</strong><small>باشگاه و پلتفرم مدیریت هوشمند</small></div></div><span class="demo-tag">INTERACTIVE DEMO</span></div><div class="card" style="padding:30px"><div class="demo-tag">نسخه نمایشی تعاملی</div><h1>به تجربه ARASH Fitness خوش آمدید</h1><p>برای مشاهده امکانات، یکی از محیط‌های زیر را انتخاب کنید. این نسخه از داده‌های نمونه استفاده می‌کند و هیچ عملیات واقعی مالی یا ثبت‌نامی انجام نمی‌دهد.</p><div class="role-grid"><button class="role" onclick="enter('admin')"><div class="big">▦</div><b>پنل مدیریت باشگاه</b><span>داشبورد مدیریتی، ورزشکاران، مربیان، اشتراک‌ها، برنامه‌ها و گزارش‌های مالی</span><div style="margin-top:20px"><span class="btn primary">ورود به پنل مدیریت ←</span></div></button><button class="role" onclick="enter('athlete')"><div class="big">◉</div><b>پنل ورزشکار</b><span>پروفایل، کارت عضویت، برنامه تمرینی، پیشرفت، رزروها و ارتباط با مربی</span><div style="margin-top:20px"><span class="btn primary">ورود به پنل ورزشکار ←</span></div></button></div></div><div class="sub" style="text-align:center">ARASH FITNESS · DEMO ENVIRONMENT · اطلاعات کاملاً نمونه</div></div>'}
function enter(r){role=r;page="dashboard";render()}
function navItems(){return role==="admin"?[["dashboard","⌂","داشبورد"],["members","♙","ورزشکاران"],["coaches","♟","مربیان"],["plans","▤","اشتراک‌ها"],["training","▧","برنامه‌های تمرینی"],["appointments","◷","رزروها"],["finance","◈","مالی و گزارش‌ها"],["settings","⚙","تنظیمات"]]:[["dashboard","⌂","داشبورد من"],["profile","♙","پروفایل من"],["program","▤","برنامه تمرینی"],["progress","↗","پیشرفت من"],["appointments","◷","رزرو مشاوره"],["messages","✉","پیام‌های مربی"],["membership","▣","کارت عضویت"]]}
function layout(content){const title=role==="admin"?"مدیریت باشگاه":"پنل ورزشکار";document.getElementById("app").innerHTML='<div class="shell"><header class="top"><div class="brand"><div class="mark">A</div><div><strong>ARASH FITNESS</strong><small>'+title+' · تجربه دیجیتال باشگاه</small></div></div><div class="top-actions"><span class="demo-tag">DEMO MODE · داده نمونه</span><button class="pill" onclick="entry()">خروج از دمو</button></div></header><div class="layout"><aside class="side"><div class="side-title">منوی اصلی</div><nav class="nav">'+navItems().map(([id,ic,n])=>'<button class="'+(page===id?'active':'')+'" onclick="go(\''+id+'\')"><span class="ico">'+ic+'</span>'+n+'</button>').join("")+'</nav><div class="side-foot">نسخه نمایشی مستقل<br>تغییرات فرم‌ها در همین مرورگر ذخیره می‌شوند.<br>بدون اتصال به سرور یا درگاه پرداخت.</div></aside><main class="main">'+content+'</main></div></div>'}
function heading(t,d){return '<div class="welcome"><div><h1>'+t+'</h1><p>'+d+'</p></div><span class="date">شنبه، ۱ آذر ۱۴۰۵</span></div>'}
function stat(label,value,sub){return '<div class="card stat"><div class="label">'+label+'</div><div class="value">'+value+'</div><small>'+sub+'</small></div>'}
function bars(){return '<div class="bars">'+state.week.map((v,i)=>'<div class="bar" style="height:'+v+'%"><span>'+["ش","ی","د","س","چ","پ","ج"][i]+'</span></div>').join("")+'</div>'}
function adminDashboard(){return heading("داشبورد مدیریت","نمای کلی عملکرد باشگاه و شاخص‌های کلیدی")+'<section class="hero"><div><span class="demo-tag">باشگاه آرش · شعبه مرکزی</span><h2>مدیریت هوشمند، تجربه حرفه‌ای</h2><p>وضعیت امروز باشگاه را یک‌جا ببینید؛ از عضویت ورزشکاران و برنامه مربیان تا رزروها و گزارش درآمد.</p><button class="btn primary" onclick="go(\'members\')">مدیریت ورزشکاران</button></div><div class="hero-art">✦</div></section><div class="grid">'+stat("کل ورزشکاران",state.members.toLocaleString("fa-IR"),"↑ ۱۲٪ نسبت به ماه قبل")+stat("اشتراک فعال",state.active.toLocaleString("fa-IR"),"۸۶٪ نرخ تمدید")+stat("درآمد این ماه",money(state.revenue),"↑ ۸٫۴٪ رشد ماهانه")+stat("رزروهای امروز",state.appointments.toLocaleString("fa-IR"),"۶ رزرو در انتظار تأیید")+'</div><div class="cols"><section class="card"><div class="card-head"><h3>روند فعالیت هفتگی</h3><span class="sub">تعداد مراجعه · نمایشی</span></div>'+bars()+'</section><section class="card"><div class="card-head"><h3>وضعیت اشتراک‌ها</h3><span class="sub">به‌روزرسانی نمایشی</span></div><div class="row"><div><strong>اشتراک فعال</strong><small>در حال استفاده</small></div><b>'+state.active+'</b></div><div class="progress"><i style="width:86%"></i></div><div class="row"><div><strong>نزدیک به انقضا</strong><small>نیازمند پیگیری</small></div><b>۲۴</b></div><div class="progress"><i style="width:24%;background:#d9a46e"></i></div><div class="row"><div><strong>منقضی‌شده</strong><small>نیازمند تمدید</small></div><b>۱۱</b></div><div class="progress"><i style="width:11%;background:#c97b70"></i></div></section></div><section class="card"><div class="card-head"><h3>فعالیت‌های اخیر</h3><button class="btn" onclick="go('appointments')">مشاهده همه</button></div>'+row("ثبت‌نام ورزشکار جدید","امیرحسین محمدی · امروز، ۱۰:۲۴","جدید","gold")+row("تمدید اشتراک","پارسا احمدی · امروز، ۰۹:۵۰","موفق")+row("رزرو جلسه مربی","سارا کریمی · امروز، ۰۹:۱۵","در انتظار","gold")+'</section>'}
function row(a,b,c,cl=""){return '<div class="row"><div><strong>'+a+'</strong><small>'+b+'</small></div><span class="badge '+cl+'">'+c+'</span></div>'}
function membersPage(){return heading("مدیریت ورزشکاران","پرونده اعضا، وضعیت اشتراک و اطلاعات تماس")+'<div class="notice">اطلاعات این صفحه نمونه است. می‌توانید عضو آزمایشی اضافه کنید؛ داده فقط در همین مرورگر ذخیره می‌شود.</div><section class="card"><div class="card-head"><h3>فهرست ورزشکاران</h3><button class="btn primary" onclick="document.getElementById(\'addMember\').classList.toggle(\'hidden\')">+ افزودن ورزشکار</button></div><div id="addMember" class="form hidden" style="margin-bottom:18px"><div class="field"><label>نام ورزشکار</label><input id="mname" placeholder="نام و نام خانوادگی"></div><div class="field"><label>شماره تماس</label><input id="mphone" placeholder="09xxxxxxxxx"></div><button class="btn primary" onclick="addMember()">ثبت نمایشی</button></div><div class="table-wrap"><table class="table"><thead><tr><th>ورزشکار</th><th>شماره تماس</th><th>نوع اشتراک</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="membersRows">'+memberRows()+'</tbody></table></div></section>'}
function memberRows(){let arr=JSON.parse(localStorage.getItem("arash-demo-members")||"null")||[["کیان رضایی","0912 345 6789","سه‌ماهه","فعال"],["امیرحسین محمدی","0912 444 2211","ماهانه","فعال"],["سارا کریمی","0935 222 1188","شش‌ماهه","فعال"],["پارسا احمدی","0910 333 5544","ماهانه","نزدیک انقضا"]];return arr.map(x=>'<tr><td><div class="person"><div class="avatar">'+x[0][0]+'</div><b>'+x[0]+'</b></div></td><td dir="ltr">'+x[1]+'</td><td>'+x[2]+'</td><td><span class="badge '+(x[3]==="نزدیک انقضا"?"gold":"")+'">'+x[3]+'</span></td><td><button class="btn" onclick="toast(\'نمایش پرونده '+x[0]+'\')">پرونده</button></td></tr>').join("")}
function addMember(){let n=document.getElementById("mname").value.trim(),p=document.getElementById("mphone").value.trim();if(!n){toast("نام ورزشکار را وارد کنید");return}let a=JSON.parse(localStorage.getItem("arash-demo-members")||"null")||[["کیان رضایی","0912 345 6789","سه‌ماهه","فعال"],["امیرحسین محمدی","0912 444 2211","ماهانه","فعال"],["سارا کریمی","0935 222 1188","شش‌ماهه","فعال"],["پارسا احمدی","0910 333 5544","ماهانه","نزدیک انقضا"]];a.unshift([n,p||"ثبت نشده","ماهانه","فعال"]);localStorage.setItem("arash-demo-members",JSON.stringify(a));state.members++;save();go("members");toast("ورزشکار نمونه اضافه شد")}
function simpleAdmin(){let data={coaches:["مربیان","مدیریت مربیان و برنامه کاری",["آرش کاظمی · مربی بدنسازی","مریم رضایی · مربی فیتنس","علی صادقی · مربی کراس‌فیت"]],plans:["اشتراک‌ها","تعریف و مدیریت طرح‌های عضویت",["اشتراک یک‌ماهه · ۱,۲۰۰,۰۰۰ تومان","اشتراک سه‌ماهه · ۳,۲۰۰,۰۰۰ تومان","اشتراک شش‌ماهه · ۵,۸۰۰,۰۰۰ تومان"]],training:["برنامه‌های تمرینی","کتابخانه برنامه‌ها و تخصیص به ورزشکار",["قدرت و هایپرتروفی · ۱۲ هفته","کاهش وزن و آمادگی عمومی · ۸ هفته","فیتنس بانوان · ۱۰ هفته"]],appointments:["رزروها و مشاوره‌ها","برنامه جلسات و درخواست‌های مشاوره",["۱۰:۰۰ · کیان رضایی · ارزیابی اولیه","۱۲:۳۰ · سارا کریمی · مشاوره تغذیه","۱۷:۰۰ · امیرحسین محمدی · بررسی برنامه"]],finance:["مالی و گزارش‌ها","گزارش‌های درآمدی و تراکنش‌های نمونه",["فروش اشتراک · ۸۴,۰۰۰,۰۰۰ تومان","فروش محصولات · ۳۲,۵۰۰,۰۰۰ تومان","جلسات خصوصی · ۷۰,۰۰۰,۰۰۰ تومان"]],settings:["تنظیمات باشگاه","اطلاعات پایه و ظاهر محیط باشگاه",["نام باشگاه: آرش فیتنس","ساعات فعالیت: ۶:۰۰ تا ۲۳:۰۰","نشانی: تهران، شعبه مرکزی"]]};let d=data[page];return heading(d[0],d[1])+'<section class="card"><div class="card-head"><h3>'+d[0]+'</h3><button class="btn primary" onclick="toast(\'این عملیات در نسخه نمایشی شبیه‌سازی شد\')">+ افزودن مورد</button></div>'+d[2].map((x,i)=>row(x,"اطلاعات نمونه · قابل ارائه در نسخه دمو",i===0?"فعال":"ثبت‌شده",i===0?"gold":""))+'</section>'+'<section class="card"><div class="card-head"><h3>ابزارهای سریع</h3><span class="sub">تعاملات نمایشی</span></div><div class="form"><div class="field"><label>عنوان</label><input placeholder="عنوان مورد جدید"></div><div class="field"><label>وضعیت</label><select><option>فعال</option><option>پیش‌نویس</option><option>غیرفعال</option></select></div></div><button class="btn primary" style="margin-top:12px" onclick="toast(\'تغییرات نمایشی ذخیره شد\')">ذخیره تغییرات</button></section>'}
function athleteDashboard(){return heading("سلام، "+state.athlete+" عزیز","به فضای شخصی تمرین و تندرستی خود خوش آمدید")+'<section class="hero"><div><span class="demo-tag">هدف این ماه</span><h2>هر روز، یک قدم قوی‌تر</h2><p>برنامه تمرینی شما فعال است. این هفته '+state.workouts+' جلسه تمرین ثبت شده و ۲ جلسه تا هدف هفتگی باقی مانده است.</p><button class="btn primary" onclick="go(\'program\')">مشاهده برنامه تمرینی</button></div><div class="hero-art">🏋️</div></section><div class="grid">'+stat("جلسات این هفته",state.workouts+" از ۶","ادامه بده؛ عالی پیش می‌روی")+stat("پیشرفت هدف",state.goal+"٪","↑ ۶٪ نسبت به ماه قبل")+stat("روزهای عضویت","۱۲۸","عضویت فعال")+stat("جلسه بعدی","فردا","ساعت ۱۸:۳۰ · مربی آرش")+'</div><div class="cols"><section class="card"><div class="card-head"><h3>پیشرفت هدف تمرینی</h3><span class="badge">در مسیر هدف</span></div><div style="font-size:27px;font-weight:900;color:var(--gold2)">'+state.goal+'٪</div><div class="progress"><i style="width:'+state.goal+'%"></i></div><p class="sub">هدف: افزایش قدرت و بهبود آمادگی جسمانی</p><button class="btn" onclick="go('+"'progress'"+')">جزئیات پیشرفت</button></section><section class="card"><div class="member"><div class="tiny">ARASH FITNESS · ATHLETE PASS</div><h3>'+state.athlete+'</h3><p>عضو ویژه · کد عضویت AF-2048</p><div class="member-foot"><span>اعتبار تا ۱۴۰۵/۱۲/۲۹</span><b>ACTIVE</b></div></div></section></div><section class="card"><div class="card-head"><h3>برنامه امروز</h3><button class="btn" onclick="go('+"'program'"+')">برنامه کامل</button></div>'+row("تمرین بالاتنه","گرم‌کردن · پرس سینه · زیربغل · سرشانه","۶ حرکت")+row("کاردیو","۱۵ دقیقه با شدت متوسط","تکمیل‌نشده","gold")+'</section>'}
function athletePage(){let pages={profile:["پروفایل من","اطلاعات شخصی و ترجیحات تمرینی"],program:["برنامه تمرینی من","برنامه اختصاصی و جلسات هفتگی"],progress:["گزارش پیشرفت","روند تمرین و هدف‌گذاری"],appointments:["رزرو مشاوره","درخواست جلسه با مربی و پیگیری رزرو"],messages:["ارتباط با مربی","گفتگو و دریافت بازخورد"],membership:["کارت عضویت","وضعیت اشتراک و اعتبار عضویت"]};let d=pages[page];let body="";if(page==="profile")body='<div class="form"><div class="field"><label>نام و نام خانوادگی</label><input id="athname" value="'+state.athlete+'"></div><div class="field"><label>هدف تمرینی</label><select><option>افزایش قدرت و عضله‌سازی</option><option>افزایش استقامت</option><option>آمادگی عمومی</option></select></div></div><button class="btn primary" style="margin-top:14px" onclick="state.athlete=document.getElementById(\'athname\').value;save();toast(\'پروفایل نمایشی ذخیره شد\');go(\'profile\')">ذخیره تغییرات</button>';else if(page==="program")body=row("شنبه · بالاتنه","پرس سینه، قایقی، سرشانه، جلو بازو","۶ حرکت")+row("دوشنبه · پایین‌تنه","اسکوات، لانج، پشت پا، ساق","۵ حرکت")+row("چهارشنبه · ترکیبی","ددلیفت، بارفیکس، پرس سرشانه","۵ حرکت");else if(page==="progress")body='<div style="font-size:32px;font-weight:900;color:var(--gold2)">'+state.goal+'٪</div><div class="progress"><i style="width:'+state.goal+'%"></i></div><p class="sub">پیشرفت نسبت به هدف ماهانه</p><button class="btn primary" onclick="state.goal=Math.min(100,state.goal+3);save();go(\'progress\');toast(\'یک مرحله پیشرفت ثبت شد\')">ثبت پیشرفت تمرینی +۳٪</button>';else if(page==="appointments")body='<div class="form"><div class="field"><label>نوع جلسه</label><select><option>ارزیابی اولیه</option><option>مشاوره تمرینی</option><option>مشاوره تغذیه</option></select></div><div class="field"><label>زمان پیشنهادی</label><select><option>فردا · ۱۸:۳۰</option><option>پس‌فردا · ۱۷:۰۰</option><option>شنبه · ۱۰:۰۰</option></select></div></div><button class="btn primary" style="margin-top:14px" onclick="toast(\'درخواست رزرو نمایشی ثبت شد\')">ثبت درخواست رزرو</button>';else if(page==="messages")body='<div class="row"><div><strong>مربی آرش</strong><small>برای حفظ کیفیت، بین جلسات آب کافی بنوش و خواب را جدی بگیر.</small></div><span class="badge">پیام جدید</span></div><div class="field"><label>پیام شما</label><textarea id="msg" placeholder="پیام خود را بنویسید..."></textarea></div><button class="btn primary" style="margin-top:10px" onclick="toast(\'پیام نمایشی ارسال شد\')">ارسال پیام</button>';else body='<div class="member"><div class="tiny">ARASH FITNESS · ATHLETE PASS</div><h3>'+state.athlete+'</h3><p>عضو ویژه · کد عضویت AF-2048</p><div class="member-foot"><span>اعتبار تا ۱۴۰۵/۱۲/۲۹</span><b>ACTIVE</b></div></div>';return heading(d[0],d[1])+'<section class="card"><div class="card-head"><h3>'+d[0]+'</h3><span class="demo-tag">اطلاعات نمونه</span></div>'+body+'</section>'}
function go(p){page=p;render()}
function render(){if(!role){entry();return}let content=role==="admin"?(page==="dashboard"?adminDashboard():page==="members"?membersPage():simpleAdmin()):(page==="dashboard"?athleteDashboard():athletePage());layout(content)}
entry();
</script>
